name: Build and Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Firebase configurations
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 -d > lib/firebase_options.dart
          echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          flutter analyze lib/
          flutter test

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Configure Keystore
        run: |
          cat << 'EOF' > android/key.properties
          storePassword=nexmusic123
          keyPassword=nexmusic123
          keyAlias=nexmusic
          storeFile=nexmusic-release.jks
          EOF

      - name: Build Android APKs
        run: |
          # 1. Build split per-ABI APKs for 32-bit and 64-bit phones.
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --extra-gen-snapshot-options=--strip
          # Save split outputs
          mkdir -p split_outputs
          cp build/app/outputs/flutter-apk/*.apk split_outputs/
          # 2. Build universal phone APK (arm + arm64 only, excludes ~9MB of useless PC x86_64)
          flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols --extra-gen-snapshot-options=--strip

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          # Dedicated 32-bit APK for Vivo Y3s and 32-bit ARM phones.
          cp split_outputs/app-armeabi-v7a-release.apk release_assets/nexMusic-armeabi-v7a.apk
          # Dedicated 64-bit APK for modern 64-bit ARM phones
          cp split_outputs/app-arm64-v8a-release.apk release_assets/nexMusic-arm64-v8a.apk
          # Universal APK
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/nexMusic-Universal.apk
          # Default fallback
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/nexMusic.apk
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/app-release.apk

      - name: Verify packaged version and app label
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          BUILD_NUMBER="${RELEASE_VERSION##*+}"
          VERSION_NAME="${RELEASE_VERSION%%+*}"
          for apk in release_assets/*.apk; do
            BADGING=$("$AAPT" dump badging "$apk")
            [[ "$BADGING" == *"versionCode='$BUILD_NUMBER'"* ]]
            [[ "$BADGING" == *"versionName='$VERSION_NAME'"* ]]
            [[ "$BADGING" == *"application-label:'nexMusic'"* ]]
            [[ "$BADGING" == *"name='com.thenex.nex_music'"* ]]
            echo "Verified $apk: nexMusic $RELEASE_VERSION"
          done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "nexMusic ${{ steps.get_version.outputs.tag }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release_assets/nexMusic.apk
            release_assets/nexMusic-armeabi-v7a.apk
            release_assets/nexMusic-arm64-v8a.apk
            release_assets/nexMusic-Universal.apk
            release_assets/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
